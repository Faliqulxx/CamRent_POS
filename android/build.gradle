allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.ext {
    compileSdkVersion = 34
    targetSdkVersion = 34
    minSdkVersion = 21
    flutter = [
        compileSdkVersion: 34,
        targetSdkVersion: 34,
        minSdkVersion: 21,
    ]
}

subprojects { subproject ->
    subproject.ext {
        compileSdkVersion = 34
        targetSdkVersion = 34
        minSdkVersion = 21
        flutter = [
            compileSdkVersion: 34,
            targetSdkVersion: 34,
            minSdkVersion: 21,
        ]
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
